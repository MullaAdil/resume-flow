version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20 || true
        - node -v
        - npm install --legacy-peer-deps
    build:
      commands:
        - node -e "const fs=require('fs');const envs=Object.entries(process.env).filter(([k])=>k.startsWith('VITE_')).map(([k,v])=>\`\${k}=\${v}\`).join('\n');fs.writeFileSync('.env', envs);fs.writeFileSync('.env.production', envs);"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
    - pattern: 'assets/**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
  cache:
    paths:
      - node_modules/**/*


