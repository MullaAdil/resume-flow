version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20 || true
        - node -v
        - npm install
    build:
      commands:
        - touch .env.production
        - env | grep VITE_ >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
